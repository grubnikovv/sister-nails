# Превью сайта для просмотра с телефона: https://grubnikovv.github.io/sister-nails/
# После каждого изменения в ветках main и design-* собирает сайт и кладёт его в ветку gh-pages.
# Превью закрыто от поисковиков (noindex), сервер (PHP) здесь не работает — только внешний вид.
name: Превью на GitHub Pages

on:
  push:
    branches: [main, 'design-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сборка
        run: |
          python3 scripts/build.py out
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' out/index.html
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          rm -f out/sitemap.xml
          touch out/.nojekyll
      - name: Выкладка в gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Превью из ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
