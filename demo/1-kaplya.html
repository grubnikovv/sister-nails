<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Черновик 1 — Капля лака</title><meta name="robots" content="noindex">
<style>
@font-face{font-family:Cormorant;font-weight:500 600;font-display:swap;src:url(../fonts/cormorant-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:Cormorant;font-weight:500 600;font-display:swap;src:url(../fonts/cormorant-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cormorant;font-style:italic;font-weight:500;font-display:swap;src:url(../fonts/cormorant-italic-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:300 600;font-display:swap;src:url(../fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:300 600;font-display:swap;src:url(../fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20BD}
:root{--bg:#ECEDEF;--ink:#0E1A33;--ink2:#4B5468;--line:rgba(14,26,51,.12);--fu:#D4006F;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,5vw,56px);z-index:3;pointer-events:none}
.top img{height:50px;width:auto}
.btn{pointer-events:auto;display:inline-flex;align-items:center;height:48px;padding:0 26px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-size:15px;font-weight:500}
.btn--g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.txt{position:fixed;z-index:2;left:clamp(16px,5vw,56px);right:clamp(16px,5vw,56px);bottom:calc(28px + env(safe-area-inset-bottom));pointer-events:none}
.eb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
h1{font:500 clamp(42px,8vw,104px)/.95 Cormorant,Georgia,serif;letter-spacing:-.02em;margin:14px 0 18px;max-width:9.5em}
h1 em{font-style:italic;color:var(--c,var(--fu));transition:color .8s}
.row{display:flex;flex-wrap:wrap;gap:10px;pointer-events:auto}
.pal{position:fixed;z-index:3;display:flex;gap:8px;padding:6px;border-radius:999px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px -12px rgba(14,26,51,.25)}
.pal button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .4s var(--ease)}
.pal button[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.shade{position:fixed;z-index:3;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.hint{position:fixed;z-index:3;font:italic 500 18px Cormorant,serif;color:var(--ink2);opacity:.8}
@media(max-width:799px){.pal{top:82px;left:50%;transform:translateX(-50%)}.shade{top:136px;left:0;right:0;text-align:center}.hint{top:58%;left:0;right:0;text-align:center}}
@media(min-width:800px){.txt{right:auto;width:46%;bottom:auto;top:50%;transform:translateY(-50%)}.pal{right:clamp(16px,5vw,56px);bottom:40px}.shade{right:clamp(16px,5vw,56px);bottom:96px}.hint{right:28%;bottom:44px}}
</style></head><body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="top"><img src="../img/logo.webp" alt="Нейл Студия Мэй’Эйлин"><a class="btn" href="../#zapis">Записаться</a></div>
<div class="shade" id="shadeName">Оттенок: фуксия</div>
<div class="pal" id="pal" role="group" aria-label="Оттенок"></div>
<div class="hint" id="hint">потяните каплю · нажмите</div>
<div class="txt">
  <div class="eb">Маникюр · педикюр · обучение</div>
  <h1>Глянец, который хочется <em>потрогать</em></h1>
  <div class="row"><a class="btn" href="../#zapis">Записаться онлайн</a><a class="btn btn--g" href="../#kursy">Курсы академии</a></div>
</div>
<script>
(function(){
var SH=[['фуксия',[.83,.02,.44]],['пудровый',[.96,.70,.82]],['бордо',[.42,.05,.12]],['нюд',[.86,.66,.58]],['молочный',[.95,.93,.90]],['чёрный',[.07,.07,.10]]];
var pal=document.getElementById('pal'),nameEl=document.getElementById('shadeName'),root=document.documentElement;
pal.innerHTML=SH.map(function(s,i){var c=s[1].map(function(v){return Math.round(v*255)});return '<button type="button" aria-label="'+s[0]+'" aria-pressed="'+(i===0)+'" data-i="'+i+'" style="background:rgb('+c+')"></button>'}).join('');
var col=SH[0][1].slice(),tcol=SH[0][1].slice();
pal.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i;tcol=SH[i][1].slice();
  pal.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});nameEl.textContent='Оттенок: '+SH[i][0];
  var c=SH[i][1].map(function(v){return Math.round(v*255)});root.style.setProperty('--c',i===4?'#B59A8E':'rgb('+c+')');splash(.6)});

var cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false});
if(!gl){document.getElementById('hint').textContent='';return}
var N=16;
var fs='precision highp float;uniform vec2 R;uniform vec3 B['+N+'];uniform vec3 C;uniform float T;\n'+
'void field(vec2 p,out float f,out vec2 g){f=0.;g=vec2(0.);for(int i=0;i<'+N+';i++){vec3 b=B[i];if(b.z<=0.)continue;vec2 d=p-b.xy;float r2=b.z*b.z;float q=dot(d,d)+r2*.35;f+=r2/q;g+=-2.*r2*d/(q*q);}}\n'+
'void main(){vec2 p=gl_FragCoord.xy;float f;vec2 g;field(p,f,g);\n'+
' float sf;vec2 sg;field(p+vec2(-14.,26.),sf,sg);\n'+
' vec3 bg=vec3(.925,.929,.937);\n'+
' float sh=smoothstep(.3,.8,sf)*.16;vec3 col=bg*(1.-sh);\n'+
' float gn=length(g)+1e-5;float dist=(f-.74)/gn;float a=clamp(dist+.5,0.,1.);\n'+
' if(a>0.){\n'+
'  float h=clamp(1.-.74/f,0.,1.);vec3 n=normalize(vec3(-g/f*30.,.6+h*2.4));\n'+
'  vec3 L=normalize(vec3(-.45,.55,1.));vec3 V=vec3(0.,0.,1.);float dif=max(dot(n,L),0.);\n'+
'  float sp=pow(max(dot(reflect(-L,n),V),0.),90.);float sp2=pow(max(dot(reflect(-normalize(vec3(.6,-.3,1.)),n),V),0.),18.)*.18;\n'+
'  vec3 r=reflect(-V,n);float box=smoothstep(.18,.26,r.y)*smoothstep(.62,.5,r.y)*smoothstep(-.55,-.35,r.x)*smoothstep(.05,-.15,r.x);\n'+
'  float fr=pow(1.-max(n.z,0.),2.2);\n'+
'  vec3 c=C*(.42+.62*dif)+vec3(1.)*(sp*.95+box*.55+sp2)+mix(vec3(0.),vec3(.9,.92,1.),fr*.35)-C*fr*.25;\n'+
'  col=mix(col,clamp(c,0.,1.),a);}\n'+
' gl_FragColor=vec4(col,1.);}';
var vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
var bu=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bu);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
var uR=gl.getUniformLocation(pr,'R'),uB=gl.getUniformLocation(pr,'B'),uC=gl.getUniformLocation(pr,'C'),uT=gl.getUniformLocation(pr,'T');
var W,H,dpr,S;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;gl.viewport(0,0,cv.width,cv.height);S=Math.min(W,H)}
addEventListener('resize',size);size();
function home(){return W<800?{x:W*.5,y:H*.42}:{x:W*.72,y:H*.48}}
// капля: голова, хвост и спутники
var head={x:home().x,y:home().y,vx:0,vy:0},tail=[],sat=[],drops=[];
for(var i=0;i<5;i++)tail.push({x:head.x,y:head.y,vx:0,vy:0});
for(i=0;i<3;i++)sat.push({a:i*2.1,d:0});
var ptr=null,lastMove=0,t0=performance.now();
function pos(e){return{x:e.clientX,y:e.clientY}}
addEventListener('pointerdown',function(e){if(e.target.closest('button,a'))return;var p=pos(e);ptr=p;lastMove=performance.now();
  var hd=Math.hypot(p.x-head.x,p.y-head.y);if(hd<S*.22)splash(1);document.getElementById('hint').style.opacity=0});
addEventListener('pointermove',function(e){if(!e.clientX&&!e.clientY)return;if(e.pointerType==='mouse'||ptr){ptr=pos(e);lastMove=performance.now()}});
addEventListener('pointerup',function(){if(matchMedia('(pointer:coarse)').matches)ptr=null});
function splash(k){var n=Math.round(9*k);for(var i=0;i<n;i++){var a=Math.random()*6.28,v=(6+Math.random()*9)*k*S/400;
  drops.push({x:head.x,y:head.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:S*(.018+Math.random()*.03),life:0})}}
var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
var arr=new Float32Array(N*3);
function frame(now){
  var t=(now-t0)/1000,idle=now-lastMove>2500||!ptr;
  var hm=home(),tx,ty;
  if(idle||!ptr){tx=hm.x+Math.sin(t*.7)*S*.12+Math.sin(t*1.9)*S*.03;ty=hm.y+Math.cos(t*.9)*S*.07}else{tx=ptr.x;ty=ptr.y}
  if(rm){tx=hm.x;ty=hm.y}
  head.vx+=(tx-head.x)*.035;head.vy+=(ty-head.y)*.035;head.vx*=.82;head.vy*=.82;head.x+=head.vx;head.y+=head.vy;
  var prev=head;tail.forEach(function(s,i){s.vx+=(prev.x-s.x)*(.09-i*.01);s.vy+=(prev.y-s.y)*(.09-i*.01);s.vx*=.8;s.vy*=.8;s.x+=s.vx;s.y+=s.vy;prev=s});
  for(var c=0;c<3;c++)col[c]+=(tcol[c]-col[c])*.06;
  var R0=S*(W<800?.24:.19),k=0,sp=Math.min(1,Math.hypot(head.vx,head.vy)/(S*.02));
  function put(x,y,r){if(k>=N)return;arr[k*3]=x*dpr;arr[k*3+1]=(H-y)*dpr;arr[k*3+2]=r*dpr;k++}
  put(head.x,head.y,R0*(1-sp*.12)*(1+Math.sin(t*2.2)*.025));
  tail.forEach(function(s,i){var d=Math.hypot(s.x-head.x,s.y-head.y);if(d>R0*.35)put(s.x,s.y,R0*(.62-i*.09)*Math.min(1,d/(R0*1.2)))});
  sat.forEach(function(s,i){var a=t*(.5+i*.17)+s.a,d=R0*(1.25+.25*Math.sin(t*.8+i));put(head.x+Math.cos(a)*d,head.y+Math.sin(a)*d*.8,R0*(.16+.05*Math.sin(t*1.3+i*2)))});
  drops=drops.filter(function(p){p.life+=1/60;var back=p.life>.45;if(back){p.vx+=(head.x-p.x)*.02;p.vy+=(head.y-p.y)*.02;p.vx*=.86;p.vy*=.86}else{p.vx*=.94;p.vy*=.94}
    p.x+=p.vx;p.y+=p.vy;var dd=Math.hypot(p.x-head.x,p.y-head.y),k2=Math.min(1,Math.max(0,(dd-R0*.75)/(R0*.6)));if(k2>0)put(p.x,p.y,p.r*k2);return !(back&&dd<R0*.8)&&p.life<4});
  for(;k<N;k++){arr[k*3+2]=0}
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform3fv(uB,arr);gl.uniform3f(uC,col[0],col[1],col[2]);gl.uniform1f(uT,t);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
setTimeout(function(){splash(.8)},900);
})();
</script>
</body></html>
